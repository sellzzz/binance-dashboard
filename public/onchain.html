<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>链上监控 · Market Monitor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell onchainShell">
      <header class="siteBar">
        <a class="brand" href="/" aria-label="返回数据监控主站">
          <span class="brandMark">M</span>
          <span class="brandCopy"><strong>Market Monitor</strong><small>Signal intelligence</small></span>
        </a>
        <nav class="siteNav" aria-label="主导航">
          <a href="/">总览</a><a href="/position.html">仓位信号</a><a href="/smallcap.html">低市值</a><a href="/reversal.html">关键区域</a><a class="active" href="/onchain.html">链上监控</a>
        </nav>
      </header>

      <section class="toolbar onchainToolbar">
        <div>
          <div class="pageEyebrow">ON-CHAIN MONITOR / BSC</div>
          <h1>链上监控</h1>
          <p>独立查看 BSC · PancakeSwap 的池子、流动性区间和价格位置。</p>
        </div>
        <div class="actions"><a class="linkBtn" href="/">返回总览</a></div>
      </section>

      <section class="onchainLayout">
        <aside class="panel onchainControlPanel">
          <div class="panelHead"><div><h2>链上标的</h2><p>支持币安合约符号或 BSC 合约地址。</p></div><span class="chainBadge">BSC</span></div>
          <label class="onchainInput">标的或合约地址<input id="symbolInput" value="PENGUUSDT" placeholder="例如 SNXXUSDT 或 0x..." /></label>
          <button id="scanBtn" class="onchainScanBtn" type="button">扫描链上池子</button>
          <div class="onchainChecklist"><span>数据范围</span><b>PancakeSwap V3</b><span>网络</span><b>BNB Smart Chain</b><span>用途</span><b>人工判断，不自动交易</b></div>
        </aside>

        <section class="panel onchainResultPanel">
          <div class="panelHead"><div><h2 id="resultTitle">等待扫描</h2><p id="resultStatus">输入标的后开始读取池子状态。</p></div><span id="poolState" class="macroSource">未读取</span></div>
          <div id="metrics" class="onchainMetrics"></div>
          <div class="onchainChartHead"><strong>流动性区间</strong><span id="chartMeta">-</span></div>
          <div id="liqChart" class="onchainChart"></div>
          <div id="chartLabels" class="onchainChartLabels"></div>
        </section>
      </section>

      <section class="panel onchainAlertPanel">
        <div class="panelHead">
          <div><h2>价格警报配置</h2><p>手动设置红圈价格，保存后用于后续链上价格监控。</p></div>
          <span class="chainBadge">MANUAL</span>
        </div>
        <form id="alertForm" class="onchainAlertForm">
          <label>合约地址<input id="alertAddress" name="address" required placeholder="0x..." /></label>
          <label>目标价格<input id="alertPrice" name="price" required type="number" min="0" step="any" placeholder="例如 0.035" /></label>
          <label>触发方式<select id="alertMode" name="mode"><option value="enter">进入目标区间</option><option value="below">跌破目标价</option><option value="above">突破目标价</option></select></label>
          <label>价格容差 %<input id="alertTolerance" name="tolerance" type="number" min="0" max="50" step="0.1" value="1" /></label>
          <label>检查频率<select id="alertInterval" name="interval"><option value="60">1 分钟</option><option value="300" selected>5 分钟</option><option value="900">15 分钟</option></select></label>
          <label>备注<input id="alertNote" name="note" placeholder="例如：红圈支撑位" /></label>
          <div class="onchainAlertActions"><button type="submit" class="onchainScanBtn">保存警报</button><button id="clearAlertsBtn" type="button" class="secondary">清空配置</button></div>
        </form>
        <div id="alertList" class="onchainAlertList"></div>
      </section>
    </main>
    <script src="/onchain.js" type="module"></script>
  </body>
</html>
